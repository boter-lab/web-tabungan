<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tabungan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>📊 Aplikasi Tabungan Saya</h1>
                    <p>Pantau perkembangan tabungan Anda secara real-time</p>
                </div>
                <div class="header-user-info">
                    <span class="user-greeting">👤 <span id="usernameDisplay">User</span></span>
                    <button id="logoutBtn" class="btn-logout">🚪 Keluar</button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Section Input -->
            <section class="input-section">
                <h2>Tambah Transaksi</h2>
                <div class="form-group">
                    <label for="amount">Nominal (Rp):</label>
                    <input type="number" id="amount" placeholder="Masukkan nominal" min="0">
                </div>
                
                <div class="form-group">
                    <label for="type">Jenis Transaksi:</label>
                    <select id="type">
                        <option value="income">💰 Menabung (Tambah)</option>
                        <option value="expense">💸 Penarikan (Kurang)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Keterangan:</label>
                    <input type="text" id="description" placeholder="Contoh: Gaji bulanan, Hadiah, dll">
                </div>

                <button id="addBtn" class="btn-add">Tambah Transaksi</button>
            </section>

            <!-- Section Info Tabungan -->
            <section class="info-section">
                <div class="info-card">
                    <h3>Saldo Saat Ini</h3>
                    <p class="balance" id="balance">Rp 0</p>
                </div>
                <div class="info-card">
                    <h3>Total Menabung</h3>
                    <p class="income" id="totalIncome">Rp 0</p>
                </div>
                <div class="info-card">
                    <h3>Total Penarikan</h3>
                    <p class="expense" id="totalExpense">Rp 0</p>
                </div>
            </section>

            <!-- Section Grafik -->
            <section class="chart-section">
                <h2>Grafik Perkembangan Tabungan</h2>
                <canvas id="savingsChart"></canvas>
            </section>

            <!-- Section Riwayat -->
            <section class="history-section">
                <h2>Riwayat Transaksi</h2>
                <div id="historyList" class="history-list">
                    <p class="empty-message">Belum ada transaksi. Mulai tambahkan transaksi Anda!</p>
                </div>
            </section>

            <!-- Button Reset -->
            <section class="action-section">
                <button id="resetBtn" class="btn-reset">Reset Data</button>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
