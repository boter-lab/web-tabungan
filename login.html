<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Tabungan</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>📊 Aplikasi Tabungan</h1>
                <p>Kelola Tabungan Anda dengan Mudah</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Masukkan username" 
                        required
                        autocomplete="off"
                    >
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Masukkan password" 
                            required
                            autocomplete="off"
                        >
                        <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Ingat saya</label>
                </div>

                <button type="submit" class="btn-login">Masuk</button>

                <div class="error-message-general" id="generalError"></div>
            </form>

            <div class="login-footer">
                <p>Username: <strong>Boter</strong></p>
                <p>Password: <strong>Boter080900</strong></p>
            </div>
        </div>

        <div class="background-decoration">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>
